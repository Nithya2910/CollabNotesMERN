spring.application.name=collab-notes-backend

# Server Port
server.port=8080

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/collab-notes

# JWT
jwt.secret=9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d9
